# Citizens tokenization prototype. Everything here is fake test data.
# All passwords in this file are DEV-ONLY and must never be reused anywhere real.
name: citizens-mqp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: dev-only-vault-password
    ports:
      # Host port 5433 so it does not clash with a Postgres already running on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 3s
      timeout: 3s
      retries: 20

  token-service:
    build:
      context: ..
      args:
        MODULE: token-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vault
      DB_USER: vault
      DB_PASSWORD: dev-only-vault-password
    # No host port: the Token Service has no login of its own, so it is reachable
    # only from the other services on the Compose network.
    depends_on:
      postgres:
        condition: service_healthy

  open-banking-api:
    build:
      context: ..
      args:
        MODULE: open-banking-api
    environment:
      TOKEN_SERVICE_URL: http://token-service:8083
      KEYCLOAK_ISSUER: http://localhost:8080/realms/citizens
      KEYCLOAK_JWKS: http://keycloak:8080/realms/citizens/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: dev-only-open-banking-api-secret
      # How often revoked consents are picked up. This is the revocation delay.
      RECONCILE_INTERVAL_MS: 5000
    # No host port: the Open Banking API is reached only through the gateway.
    depends_on:
      - token-service

  # Stand-in for IBM API Connect: the only public entry point to the Open Banking API.
  gateway:
    build:
      context: ..
      args:
        MODULE: gateway
    environment:
      OPEN_BANKING_API_URL: http://open-banking-api:8082
      KEYCLOAK_ISSUER: http://localhost:8080/realms/citizens
      KEYCLOAK_JWKS: http://keycloak:8080/realms/citizens/protocol/openid-connect/certs
      ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8081:8081"
    depends_on:
      - open-banking-api

  payment-receiver:
    build:
      context: ..
      args:
        MODULE: payment-receiver
    environment:
      TOKEN_SERVICE_URL: http://token-service:8083
    ports:
      - "8084:8084"
    depends_on:
      - token-service

  # Stand-in for Ping Identity: the bank's login and consent server.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password
      # Tokens always carry the browser-facing issuer, even when a service
      # reaches Keycloak as http://keycloak:8080 inside the Compose network.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/citizens-realm.json:/opt/keycloak/data/import/citizens-realm.json:ro
    ports:
      - "8080:8080"
