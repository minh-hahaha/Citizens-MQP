# Citizens tokenization prototype. Everything here is fake test data.
# All passwords in this file are DEV-ONLY and must never be reused anywhere real.
name: citizens-mqp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: dev-only-vault-password
    ports:
      # Host port 5433 so it does not clash with a Postgres already running on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 3s
      timeout: 3s
      retries: 20

  token-service:
    build:
      context: ..
      args:
        MODULE: token-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vault
      DB_USER: vault
      DB_PASSWORD: dev-only-vault-password
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  open-banking-api:
    build:
      context: ..
      args:
        MODULE: open-banking-api
    environment:
      TOKEN_SERVICE_URL: http://token-service:8083
    ports:
      - "8082:8082"
    depends_on:
      - token-service

  payment-receiver:
    build:
      context: ..
      args:
        MODULE: payment-receiver
    environment:
      TOKEN_SERVICE_URL: http://token-service:8083
    ports:
      - "8084:8084"
    depends_on:
      - token-service
