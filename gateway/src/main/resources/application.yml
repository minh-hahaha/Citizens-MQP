server:
  port: 8081

spring:
  cloud:
    gateway:
      server:
        webflux:
          # Everything under /fdx/v6 is forwarded to the Open Banking API.
          routes:
            - id: open-banking-api
              uri: ${OPEN_BANKING_API_URL:http://localhost:8082}
              predicates:
                - Path=/fdx/v6/**
          # Lets the React app, which runs in the browser, call the API.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ["http://localhost:3000", "http://localhost:5173"]
                allowedMethods: GET
                allowedHeaders: "*"
